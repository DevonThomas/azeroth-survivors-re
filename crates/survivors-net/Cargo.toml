[package]
name = "survivors-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azeroth Survivors' co-op wire protocol over renet (UDP), and the client end of it"

[lints]
workspace = true

[features]
# The UDP transport: the client connection and renet's channel setup. Off, only the message types
# and their encoding remain, which is all the browser build (no UDP there) needs to compile.
default = ["transport"]
transport = ["dep:renet", "dep:renet_netcode"]

[dependencies]
survivors-sim = { path = "../survivors-sim" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
renet = { version = "2.0", optional = true }
renet_netcode = { version = "2.0", optional = true }
