[package]
name = "survivors-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azeroth Survivors' rules with no engine under them: the horde, the spells, the party and the clock. The client steps it locally for a solo run; the dedicated server steps it for a room."

[lints]
workspace = true

[dependencies]
# Bevy 0.18's own glam, so `Vec2`/`Vec3` cross into the client without conversion.
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
